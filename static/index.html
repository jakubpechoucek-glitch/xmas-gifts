<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maligayang Pasko 🎄</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <header id="hud" hidden>
    <div class="hud-progress" aria-live="polite">
      <span class="hud-icon" aria-hidden="true">🎁</span>
      <span id="count">0 / 5</span>
      <span class="bar" aria-hidden="true"><i id="bar"></i></span>
    </div>
    <button id="sound" class="icon-btn" type="button" aria-label="Music on or off" aria-pressed="true">🔊</button>
  </header>

  <main>
    <svg id="scene" viewBox="0 0 400 560" role="img" aria-label="A Christmas tree with gifts underneath" hidden>
      <defs>
        <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2e9d55"/>
          <stop offset="1" stop-color="#0f5a2f"/>
        </linearGradient>
        <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#6d4325"/>
          <stop offset="0.5" stop-color="#8b5a2f"/>
          <stop offset="1" stop-color="#5b371d"/>
        </linearGradient>
        <radialGradient id="parolGrad" cx="0.5" cy="0.5" r="0.6">
          <stop offset="0" stop-color="#fff6c2"/>
          <stop offset="0.55" stop-color="#ffb300"/>
          <stop offset="1" stop-color="#e53935"/>
        </radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <ellipse cx="200" cy="498" rx="195" ry="30" fill="#e8f0ff" opacity="0.92"/>
      <ellipse cx="200" cy="492" rx="150" ry="18" fill="#ffffff" opacity="0.9"/>

      <g id="parols"></g>

      <rect x="180" y="436" width="40" height="52" fill="url(#trunk)"/>
      <g id="tree" stroke="#0b3d20" stroke-width="1.2" stroke-linejoin="round">
        <polygon points="200,238 352,442 48,442" fill="url(#leaf)"/>
        <polygon points="200,168 326,352 74,352" fill="url(#leaf)"/>
        <polygon points="200,108 290,252 110,252" fill="url(#leaf)"/>
        <polygon points="200,62 262,174 138,174" fill="url(#leaf)"/>
      </g>
      <g id="lights"></g>
      <g id="ornaments"></g>

      <g id="star" class="star locked" tabindex="0" role="button" aria-label="Golden star on top of the tree"></g>

      <g id="gifts"></g>
    </svg>
    <p id="status" hidden></p>
  </main>

  <div id="intro" class="overlay">
    <div class="intro-box">
      <div class="intro-emoji" aria-hidden="true">🎄</div>
      <h1 id="intro-title">Maligayang Pasko!</h1>
      <p id="intro-text">Loading your surprise…</p>
      <button id="intro-btn" class="btn" type="button" hidden>Open the surprise ✨</button>
    </div>
  </div>

  <div id="card-wrap" class="overlay hidden">
    <article class="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
      <div id="card-icon" class="card-icon" aria-hidden="true"></div>
      <h2 id="card-title"></h2>
      <p id="card-text"></p>
      <button id="card-close" class="btn" type="button">Close</button>
    </article>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js" defer></script>
</body>
</html>
