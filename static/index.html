<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d2e">
  <title>Maligayang Pasko 🎄</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <canvas id="gl" aria-label="A 3D Christmas tree with gifts underneath. Drag to look around, tap a gift to open it."></canvas>

  <header id="hud" hidden>
    <div class="hud-progress" aria-live="polite">
      <span class="hud-icon" aria-hidden="true">🎁</span>
      <span id="count">0 / 5</span>
      <span class="bar" aria-hidden="true"><i id="bar"></i></span>
    </div>
    <button id="sound" class="icon-btn" type="button" aria-label="Music on or off" aria-pressed="true">🔊</button>
  </header>

  <nav id="gift-nav" class="sr-only" aria-label="Gifts under the tree"></nav>

  <div id="intro" class="overlay">
    <div class="intro-box">
      <div class="intro-emoji" aria-hidden="true">🎄</div>
      <h1 id="intro-title">Maligayang Pasko!</h1>
      <p id="intro-text">Loading your surprise…</p>
      <form id="intro-form" class="intro-form" hidden novalidate>
        <label for="email" class="sr-only">Work e-mail</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@company.com" required>
        <p id="form-error" role="alert"></p>
        <button class="btn" type="submit">Find my gift 🎁</button>
      </form>
      <button id="intro-btn" class="btn" type="button" hidden>Open the surprise ✨</button>
      <p><button id="not-you" class="link-btn" type="button" hidden></button></p>
    </div>
  </div>

  <div id="card-wrap" class="overlay hidden">
    <article class="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
      <div id="card-icon" class="card-icon" aria-hidden="true"></div>
      <h2 id="card-title"></h2>
      <p id="card-text"></p>
      <button id="card-close" class="btn" type="button">Close</button>
    </article>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js" defer></script>
</body>
</html>
